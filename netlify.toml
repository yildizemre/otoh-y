# Netlify sadece arayüzü (public/) yayınlar.
# Arama / toptancı bağlantıları için backend ayrı çalışmalı (Render, Railway, VPS — bkz. README).
# Backend adresi belli olunca aşağıdaki /api yönlendirmesindeki adresi değiştirin.

[build]
  publish = "public"
  command = ""

[[redirects]]
  from = "/api/*"
  to = "https://parca-ai.onrender.com/api/:splat"
  status = 200
  force = true
