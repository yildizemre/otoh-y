# Netlify sadece arayüzü (public/) yayınlar.
# Arama / toptancı bağlantıları için backend ayrı çalışmalı (Render, Railway, VPS — bkz. README).
# Backend: https://parca.hypevisionlab.com (orbisoft VPS, Docker + nginx + Let's Encrypt)

[build]
  publish = "public"
  command = ""

[[redirects]]
  from = "/api/*"
  to = "https://parca.hypevisionlab.com/api/:splat"
  status = 200
  force = true
